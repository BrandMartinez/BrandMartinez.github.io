name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Check GitHub Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP_STATUS=$(curl --silent \
            --output pages-response.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "${HTTP_STATUS}" = "404" ]; then
            echo "GitHub Pages is not enabled for this repository."
            echo "Go to Settings > Pages and set Source to GitHub Actions."
            exit 1
          fi

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Could not read the GitHub Pages configuration."
            echo "GitHub API returned HTTP ${HTTP_STATUS}."
            cat pages-response.json
            exit 1
          fi

          SOURCE=$(jq -r '.build_type // "legacy"' pages-response.json)

          if [ "${SOURCE}" != "workflow" ]; then
            echo "GitHub Pages is not using GitHub Actions."
            echo "Current build type: ${SOURCE}"
            echo "Go to Settings > Pages and set Source to GitHub Actions."
            exit 1
          fi

          echo "GitHub Pages is correctly configured."

  build:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve site URL and base path
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"

          if [ -n "${{ vars.BASE_PATH }}" ]; then
            BASE_PATH="${{ vars.BASE_PATH }}"
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO}/"
          fi

          if [ -n "${{ vars.SITE_URL }}" ]; then
            SITE_URL="${{ vars.SITE_URL }}"
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            SITE_URL="https://${OWNER}.github.io"
          else
            SITE_URL="https://${OWNER}.github.io/${REPO}"
          fi

          echo "BASE_PATH=${BASE_PATH}" >> "${GITHUB_ENV}"
          echo "SITE_URL=${SITE_URL}" >> "${GITHUB_ENV}"

          echo "SITE_URL=${SITE_URL}"
          echo "BASE_PATH=${BASE_PATH}"

      - name: Build Astro site
        run: pnpm run build
        env:
          SITE_URL: ${{ env.SITE_URL }}
          BASE_PATH: ${{ env.BASE_PATH }}
          GITHUB_USER: ${{ vars.GITHUB_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
